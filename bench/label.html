<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Judge Calibration</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --line: #e3e1dc;
    --caller: #eef3fb; --caller-ink: #1f4f8f; --agent: #f1f7ef; --agent-ink: #2d6a35;
    --tool: #8a8a90; --bad: #b3261e; --bad-bg: #fbeceb; --good: #1e7a3a; --good-bg: #e9f5ec;
    --accent: #3b5bdb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --panel: #1d1d20; --text: #ececee; --muted: #9a9aa2; --line: #2e2e33;
      --caller: #1b2534; --caller-ink: #8fb4ec; --agent: #1b281e; --agent-ink: #8fd19a;
      --tool: #7c7c84; --bad: #f2867e; --bad-bg: #3a1f1d; --good: #7fd494; --good-bg: #1c3222;
      --accent: #8ea6ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px;
           border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 1; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .progress { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--accent); transition: width .2s; }
  .count { color: var(--muted); font-variant-numeric: tabular-nums; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; padding: 20px;
         max-width: 1280px; margin: 0 auto; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .msg { padding: 8px 12px; border-radius: 8px; margin: 8px 0; white-space: pre-wrap; }
  .msg b { display: block; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; margin-bottom: 2px; }
  .caller { background: var(--caller); } .caller b { color: var(--caller-ink); }
  .agent { background: var(--agent); } .agent b { color: var(--agent-ink); }
  .tool { color: var(--tool); font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
          margin: 4px 0 4px 12px; white-space: pre-wrap; word-break: break-word; }
  aside { position: sticky; top: 74px; align-self: start; display: flex; flex-direction: column; gap: 14px; }
  .rule-name { font-weight: 600; margin-bottom: 6px; }
  .rule-text { font-size: 14px; }
  details { font-size: 13px; color: var(--muted); }
  details pre { white-space: pre-wrap; font: inherit; margin: 6px 0 0; }
  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button { font: inherit; border-radius: 8px; border: 1px solid var(--line); background: var(--panel);
           color: var(--text); padding: 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.violation.on { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); font-weight: 600; }
  button.ok.on { background: var(--good-bg); border-color: var(--good); color: var(--good); font-weight: 600; }
  button.unsure.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  button.unsure { grid-column: 1 / -1; }
  textarea { width: 100%; min-height: 64px; font: inherit; font-size: 14px; padding: 8px; border-radius: 8px;
             border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .nav { display: flex; justify-content: space-between; gap: 8px; }
  .hint { color: var(--muted); font-size: 12px; }
  kbd { font: 11px ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  .done { text-align: center; padding: 60px 20px; }
  .done code { background: var(--panel); border: 1px solid var(--line); padding: 4px 8px; border-radius: 6px; }
</style>
</head>
<body>
<header>
  <h1>Judge calibration</h1>
  <div class="progress"><div id="bar"></div></div>
  <span class="count" id="count"></span>
</header>
<main id="main"></main>
<script>
let items = [], rules = {}, labels = {}, idx = 0;

const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

function renderTranscript(text) {
  return text.split("\n").reduce((html, line) => {
    if (line.startsWith("CALLER: "))
      return html + `<div class="msg caller"><b>Caller</b>${esc(line.slice(8))}</div>`;
    if (line.startsWith("ASSISTANT: "))
      return html + `<div class="msg agent"><b>Agent</b>${esc(line.slice(11))}</div>`;
    if (line.trim().startsWith("[tool"))
      return html + `<div class="tool">${esc(line.trim())}</div>`;
    // continuation of a multi-line message: append to the previous block
    return html.replace(/<\/div>$/, "\n" + esc(line) + "</div>");
  }, "");
}

function updateProgress() {
  const done = items.filter(i => labels[i.id]).length;
  document.getElementById("bar").style.width = `${(100 * done) / items.length}%`;
  document.getElementById("count").textContent = `${done} / ${items.length} labeled`;
  return done;
}

function render() {
  const done = updateProgress();
  const main = document.getElementById("main");
  if (done === items.length && idx >= items.length) {
    main.innerHTML = `<div class="panel done" style="grid-column:1/-1">
      <h2>All ${items.length} labeled</h2>
      <p>See how the judge compares. In your terminal, run:</p>
      <p><code>uv run python -m bench.label report</code></p></div>`;
    return;
  }
  idx = Math.min(Math.max(idx, 0), items.length - 1);
  const it = items[idx], cur = labels[it.id] || {};
  main.innerHTML = `
    <section class="panel">
      <div class="meta">Item ${idx + 1} of ${items.length} · scenario <b>${esc(it.scenario)}</b></div>
      ${renderTranscript(it.transcript)}
    </section>
    <aside>
      <div class="panel">
        <div class="rule-name">${esc(it.rule)}</div>
        <div class="rule-text">${esc(rules[it.rule] || "")}</div>
      </div>
      <div class="panel">
        <details><summary>Who the caller is (scenario)</summary><pre>${esc(it.persona)}</pre></details>
      </div>
      <div class="panel" style="display:flex;flex-direction:column;gap:10px">
        <div class="buttons">
          <button class="violation ${cur.label === "violation" ? "on" : ""}" data-label="violation">Violation <kbd>V</kbd></button>
          <button class="ok ${cur.label === "ok" ? "on" : ""}" data-label="ok">OK <kbd>O</kbd></button>
          <button class="unsure ${cur.label === "unsure" ? "on" : ""}" data-label="unsure">Unsure <kbd>U</kbd></button>
        </div>
        <textarea id="note" placeholder="Optional note: why? (helps when we review disagreements)">${esc(cur.note || "")}</textarea>
        <div class="nav">
          <button id="prev">← Prev</button>
          <button id="next">Next →</button>
        </div>
        <div class="hint">Judge only what the transcript shows, using the rule as written. The judge's verdict is hidden until the report.</div>
      </div>
    </aside>`;
  main.querySelectorAll("[data-label]").forEach(b => b.onclick = () => save(b.dataset.label));
  document.getElementById("prev").onclick = () => { idx--; render(); };
  document.getElementById("next").onclick = () => { idx++; render(); };
  window.scrollTo(0, 0);
}

async function save(label) {
  const it = items[idx];
  const note = document.getElementById("note").value;
  labels[it.id] = { label, note };
  await fetch("/api/label", { method: "POST", headers: { "Content-Type": "application/json" },
                              body: JSON.stringify({ id: it.id, label, note }) });
  // advance to the next unlabeled item (or past the end when finished)
  const next = items.findIndex((x, j) => j > idx && !labels[x.id]);
  const any = items.findIndex(x => !labels[x.id]);
  idx = next >= 0 ? next : any >= 0 ? any : items.length;
  render();
}

document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA") return;
  const k = e.key.toLowerCase();
  if (k === "v") save("violation");
  else if (k === "o") save("ok");
  else if (k === "u") save("unsure");
  else if (k === "arrowright") { idx++; render(); }
  else if (k === "arrowleft") { idx--; render(); }
});

fetch("/api/items").then(r => r.json()).then(d => {
  items = d.items; rules = d.rules; labels = d.labels;
  const first = items.findIndex(i => !labels[i.id]);
  idx = first >= 0 ? first : items.length;
  render();
});
</script>
</body>
</html>
